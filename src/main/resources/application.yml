spring:
  application:
    name: fedstock-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: false

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

jwt:
  secret: ${JWT_SECRET:dev-temp-secret-key-only-for-local-development-please-change-this-1234567890}
  access-token-expiration-ms: 3600000

storage:
  s3:
    bucket: ${ARTIFACT_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
    admin-password: ${S3_ADMIN_PASSWORD:22}
